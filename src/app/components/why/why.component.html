<section class="section why" id="why">
  <div class="container">
    <p class="section-label">Why Tharawat</p>
    <h2 class="section-title">لماذا ثروات؟</h2>

    <ol class="reasons">
      @for (item of whyUs; track item; let i = $index) {
        <li>
          <span class="num">{{ indexLabel(i) }}</span>
          <p>{{ item }}</p>
        </li>
      }
    </ol>
  </div>
</section>
